name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install OpenSSL dev (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build (release)
        shell: bash
        run: cargo build --release --locked

      - name: Package asset
        shell: bash
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          asset="codebuddy-proxy-rs-${triple}${exe}"
          mkdir -p dist
          cp "target/release/codebuddy-proxy-rs${exe}" "dist/${asset}"
          echo "asset=${asset}" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.asset }}
